name: Advisory OHLC History and Current Technical Screening

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

concurrency:
  group: advisory-ohlc-history-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-advisory-history-and-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HISTORY_RUN_ID: me-sr28-advisory-history-${{ github.run_id }}
      SCREENING_RUN_ID: me-sr28-current-screening-${{ github.run_id }}
    steps:
      - name: Checkout executable source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Capture advisory history runtime preflight
        id: preflight
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m market_engine.source_refresh.advisory_ohlc_history_runtime preflight \
            --run-id "$HISTORY_RUN_ID"

      - name: Upload advisory history runtime preflight
        id: upload_preflight
        if: ${{ always() && steps.preflight.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: advisory-ohlc-history-diagnostic-${{ env.HISTORY_RUN_ID }}-preflight
          path: artifacts/market_engine/advisory_ohlc_history_diagnostics/${{ env.HISTORY_RUN_ID }}/stages/preflight/
          if-no-files-found: error
          retention-days: 14

      - name: Record preflight persistence receipt
        id: receipt_preflight
        if: ${{ always() && steps.upload_preflight.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.upload_preflight.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_preflight.outputs.artifact-digest }}
        run: |
          PYTHONPATH=src python -m market_engine.source_refresh.advisory_ohlc_history_runtime record-receipt \
            --run-id "$HISTORY_RUN_ID" \
            --stage-id preflight \
            --artifact-name "advisory-ohlc-history-diagnostic-$HISTORY_RUN_ID-preflight" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST"

      - name: Gate runtime preflight
        id: gate_preflight
        if: ${{ always() && steps.preflight.outcome != 'skipped' }}
        env:
          EXECUTION_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          PYTHONPATH=src python -m market_engine.source_refresh.advisory_ohlc_history_runtime gate-stage \
            --run-id "$HISTORY_RUN_ID" \
            --stage-id preflight \
            --execution-outcome "$EXECUTION_OUTCOME"

      - name: Execute primary chunk 000
        id: execute_primary_000
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m market_engine.source_refresh.advisory_ohlc_history_runtime execute-stage \
            --run-id "$HISTORY_RUN_ID" \
            --stage-id "primary-chunk-000"

      - name: Upload primary chunk 000 diagnostic
